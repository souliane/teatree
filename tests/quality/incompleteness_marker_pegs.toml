# The shrink-only ledger behind tests/quality/test_incompleteness_marker_ratchet.py:
# every place in this tree where code declares its own incompleteness. Phrase
# families live in src/teatree/quality/incompleteness_markers.yaml.
#
# Every key in both tables is a repo-relative scanned file. Adding or raising an
# entry means shipping a statement that the code is unfinished, which is
# inadmissible by default: finish it, or do not ship the phase. Where an entry
# genuinely must grow, the rationale belongs in the commit message and the
# banking is a visible, attributable line in the diff -- never automatic. Two
# disjoint PRs never collide: git unions independent keys, and same-file
# contention surfaces as a textual conflict.
#
# The tables are alphabetical rather than in reading order -- toml-sort owns
# their layout.

# Markers whose tracking issue is CLOSED, per tests/quality/closed_issues.toml.
# A deferral nobody is tracking is either done-but-uncleaned or an orphaned
# promise; each entry is one such site awaiting a per-item decision.
#
# Exhaustive by issue rather than by count: a marker naming a closed issue not
# listed for its file blocks, and an entry that no longer matches a live marker
# blocks too, so the list cannot outlive the prose it describes.
[closed_issue_deferrals]
"docs/blueprint/memory-consolidation.md" = [2447]
"docs/blueprint/rubric-done-gate.md" = [2240]
"hooks/scripts/hook_router.py" = [100]
"src/teatree/agents/pydantic_ai_config.py" = [3157]
"src/teatree/cli/loop/app.py" = [100]
"src/teatree/core/gates/spec_coverage_gate.py" = [2232]
"src/teatree/core/management/commands/_rubric_commands.py" = [2240]
"src/teatree/core/management/commands/loop_dispatch.py" = [100]
"src/teatree/core/models/rubric.py" = [2240]

