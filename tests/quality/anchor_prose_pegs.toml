# Content digests of the doc prose describing a named anchor -- the ledger (#4216).
# Each table is one anchor. `radius` pins how many chars either side of an occurrence count
# as describing it; changing it invalidates every digest in the table, deliberately and loudly.
# Every other key is a repo-relative doc surface; the value is one digest per MERGED window,
# in file order. An ADDED digest blocks (the failure prints the new window, so a human reads
# the sentence rather than pattern-matching a hash); a DROPPED digest blocks (remove the peg).
# Two disjoint PRs never collide: git unions independent file keys; same-file contention
# surfaces as a textual conflict. Scope is a LIMIT, not coverage -- tracked files outside
# tests/ only, and a digest proves a sentence UNCHANGED, never TRUE.

[TaskCreated]
radius = 300
