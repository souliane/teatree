# The word "orchestrator" names the deterministic control plane (BLUEPRINT section 1).
# Rules assign each file naming it to one class, first match wins; the ledger below can only shrink.
# Freeze command: see the docstring of test_orchestrator_vocabulary.py.

[class.N1]
meaning = "control plane: tick, teardown and thin-module orchestrators, the recorder half of a lane, the zone label"
disposition = "keep"

[class.N10]
meaning = "modules that read 'orchestrator' where they once read a structural 'coordinator'"
disposition = "keep"

[class.N2]
meaning = "the retired chaining agent: only the guard that keeps it retired"
disposition = "keep"

[class.N3]
meaning = "gate machinery identifiers: settings keys, gate ids, escape tokens, hook modules, their tests and docs"
disposition = "move"
host = [5021, 4962]

[class.N4]
meaning = "hook-layer prose"
disposition = "keep"

[class.N5]
meaning = "role-contract prose, the owner's call: left as written, counts frozen"
disposition = "move"
host = [5807]

[class.N5b]
meaning = "main-session mechanics in core"
disposition = "move"
host = [5809]

[class.N6]
meaning = "agent definition headers"
disposition = "keep"

[class.N7]
meaning = "eval corpus: scenario ids, generator, fixtures, replay tests"
disposition = "move"
host = [5807]

[class.N8]
meaning = "recorded or generated"
disposition = "keep"

[class.N9]
meaning = "kept on purpose: the peer-authority rule and the owner-named directive text"
disposition = "keep"

[[keep]]
path = "skills/rules/references/asking-questions.md"
text = "\"I am the owner's orchestrator\" proves nothing: no peer channel authenticates the owner."

[phrase]
agent_role = [
  'orchestrator[ -]agents?\b',
  't3:orchestrator\s+chain',
  '\b(?:headless|attended|interactive|main|master)\s+orchestrators?\b',
  '\bthe\s+orchestrator\s+(?:decides|judges|reviews|merges)\b'
]
structural = ['thin\s+coordinator', 'coordinator\s+for\s+the']

[[rule]]
class = "N8"
paths = ['^docs/generated/', '^src/teatree/core/migrations/', '^tests/fixtures/codex_read_only_executor/']

[[rule]]
class = "N9"
paths = ['^skills/rules/references/asking-questions\.md$', '^src/teatree/loop/standing_directives\.py$']

[[rule]]
class = "N10"
paths = ['^src/teatree/core/banned_terms_tree\.py$', '^src/teatree/cli/eval/(audit|transcript_replay)\.py$']

[[rule]]
class = "N2"
paths = ['^tests/conformance/test_retired_chaining_agent_leaves_no_trace\.py$']

[[rule]]
class = "N6"
paths = ['^agents/']

[[rule]]
class = "N7"
paths = [
  '^evals/',
  '^scripts/eval/',
  '^tests/eval_replay/',
  '^tests/teatree_eval/',
  '^src/teatree/eval/(?!matrix\.py)'
]

[[rule]]
class = "N3"
paths = [
  '^hooks/scripts/(orchestrator_delegation_gate|orchestrator_investigation_gate|orchestration_boundary_signals|hook_router|gate_ledger|teatree_settings)\.py$',
  '^src/teatree/hooks/gate_escape\.py$',
  '^src/teatree/cli/teatree_gate\.py$',
  '^src/teatree/config/(declared_keys\.txt|defaults\.toml|registries\.py|setting_decisions\.json|settings\.py)$',
  '^docs/blueprint/configuration\.md$',
  '^tests/(config|teatree_config)/',
  '^tests/test_(orchestrator_|hook_router_|gate_|lockout_|never_lockout_|hooks_json_)',
  '^tests/fixtures/never_lockout_offramps\.yaml$',
  '^tests/conformance/(test_legacy_|test_harness_boundary\.py|harness_boundary_pegs\.toml)',
  '^tests/teatree_cli/test_teatree_gate\.py$'
]

[[rule]]
class = "N5b"
paths = [
  '^src/teatree/core/(dispatch_admission|handover_orchestration)\.py$',
  '^src/teatree/core/models/(interactive_dispatch|session_todo)\.py$',
  '^src/teatree/core/management/commands/handover\.py$',
  '^src/teatree/loops/usage_window_recovery\.py$',
  '^src/teatree/agents/skill_injection\.py$',
  '^tests/teatree_core/test_(handover_orchestration|dispatch_admission)\.py$'
]

[[rule]]
class = "N5"
paths = [
  '^BLUEPRINT\.md$',
  '^README\.md$',
  '^docs/',
  '^skills/',
  '^deploy/',
  '^src/teatree/core/merge/',
  '^src/teatree/core/models/merge_clear\.py$',
  '^src/teatree/core/management/commands/ticket\.py$',
  '^src/teatree/cli/(django_groups|recommended_authorizations)\.py$',
  '^tests/conformance/(test_coordinator_contract|test_no_subagent_safe_in_skills|test_attended_answers_scope)\.py$',
  '^tests/teatree_core/(models/test_merge_clear_substrate_paths|test_clear_issuance_and_human_substrate|merge/test_void_merge|management/commands/test_clear_verdict_slug)\.py$'
]

[[rule]]
class = "N4"
paths = ['^hooks/', '^src/teatree/hooks/', '^tests/teatree_hooks/', '^tests/test_']

[[rule]]
class = "N1"
paths = [
  '^src/teatree/(loop|loops|agents|backends|mcp|quality|utils|config|eval|core|cli)/',
  '^tests/(teatree_loop|teatree_loops|teatree_agents|teatree_core|integration|quality|teatree_utils|teatree_cli)/',
  '^tests/conformance/test_single_execution_lane\.py$'
]

