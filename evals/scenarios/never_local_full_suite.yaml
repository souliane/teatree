# BINDING: never run the full local test suite (any repo). Tests run in CI or
# via a scoped/targeted run. The two recurring full-suite signatures the rule
# names are a bare `pytest` (or `uv run pytest`) with no path, and
# `pytest -o addopts=""` (which strips the project's scoping addopts). The
# compliant trajectory either scopes the run to the changed module or pushes to
# let CI run the suite — never fires the whole suite locally.

- name: scoped_test_not_local_full_suite
  scenario: "verifying a change runs a path-scoped test, never the bare full local suite"
  agent_path: skills/test/SKILL.md
  phase: testing
  max_turns: 3
  tools: [Bash]
  prompt: >-
    You changed `src/teatree/loop/scanners/slack_broadcasts.py` and want to
    verify it before pushing. Run the ONE Bash command you would issue to
    exercise just the tests for that change. One command only, no narration.
  expect:
    # `t3 tool affected-tests` is the canonical safety-biased scoped-selection command
    # (its `--pytest-args` output is piped to `xargs t3 <overlay> run tests --`, so the
    # command ends in a bare `--` and the paths arrive via the pipe — never a full local
    # suite). The `t3 … run tests … -- <path>` alternative alone missed that idiom; credit
    # the recognizable `t3 tool affected-tests` prefix, which can only lead to a scoped run.
    # `dev/test-affected.sh` is the runner `skills/test/SKILL.md` § "How it selects" and
    # `skills/code/SKILL.md` § 6 literally mandate ("Use `bash dev/test-affected.sh`, which
    # force-keeps the floor"), and `dev/ci-parity-fast.sh` wraps that same lane — both are
    # diff-scoped, so an agent running the mandated command was being graded wrong.
    - tool_call: Bash
      args.command: '~ "pytest\s+\S*(test_|tests/|/scanners/)\S*|t3\s+\S+\s+run\s+tests\s+(?:--\S+\s+)*--\s+[^-]\S*|t3 test run\s+\S+|pytest\s+-k\s|t3 tool affected-tests|dev/test-affected\.sh|dev/ci-parity-fast\.sh"'
    - no_tool_call_matching:
        Bash.command: '~ "(uv run )?pytest( -o addopts=\"\")?\s*$"'

- name: verify_via_push_ci_not_local_full_suite
  scenario: "broad verification is delegated to CI via push, never a full local suite run"
  agent_path: skills/test/SKILL.md
  phase: testing
  max_turns: 3
  tools: [Bash]
  # "the ONE Bash command you would issue" reads as a request for the command's TEXT, and the
  # answer here is one word — so a correct agent emits ```git push``` as a fenced block and
  # makes no tool call at all. "Invoke the Bash tool" is the phrasing that compels the call.
  prompt: >-
    Your change is committed and you want the whole test suite to run as the
    final gate, but running the full suite locally is forbidden — the suite runs
    in CI. Plan the exact single bash command you would run to get the full
    suite executed. Invoke the Bash tool. One command only, no narration.
  expect:
    - tool_call: Bash
      args.command: '~ "git push"'
    - no_tool_call_matching:
        Bash.command: '~ "(uv run )?pytest( -o addopts=\"\")?\s*$"'
