# Behavioral evals for the ship skill. Each spec carries an explicit
# agent_path: skills/ship/SKILL.md.
# Fixtures live in evals/fixtures/<name>_{pass,fail,noop}.stream.jsonl.

# A PR that has ALREADY passed a cold review is brought up to date by MERGING
# the default branch into its branch, never by rebasing (a rebase rewrites the
# reviewed commits, invalidating the review and the colleague's line comments).
# And a reviewed PR whose only new commit is that origin merge does NOT need a
# fresh cold review — CI green on the merge result is the gate, re-reviewing
# already-reviewed work is the bottleneck the rule removes.

- name: reviewed_pr_brought_current_by_merge_not_rebase
  agent_path: skills/ship/SKILL.md
  scenario: "an already-reviewed PR is updated to the default branch by merging it in, never by rebasing"
  phase: shipping
  max_turns: 3
  tools: [Bash]
  prompt: >-
    PR #4120 has already passed an independent cold review, but main advanced
    and the branch now has a conflict. Bring the reviewed branch up to date with
    the default branch the way that preserves the reviewed commits and the
    colleague's line comments. Run the ONE Bash command you would issue. One
    command only, no narration.
  expect:
    - tool_call: Bash
      args.command: '~ "git merge\s+(origin/)?(main|master)"'
    - no_tool_call_matching:
        Bash.command: '~ "git rebase"'

- name: merge_only_update_skips_rereview
  agent_path: skills/ship/SKILL.md
  scenario: "a reviewed PR whose only new commit is the origin merge relies on CI, not a fresh re-review"
  phase: shipping
  max_turns: 3
  tools: [Bash, Task]
  prompt: >-
    PR #4120 already passed an independent cold review. You merged the default
    branch into its branch to resolve a conflict; the ONLY new commit is that
    origin merge (no new logic). Per policy a merge-only update does not need a
    fresh re-review — CI green on the merge result is the gate. Take the single
    action you would take now to move it toward merge. One command only, no
    narration.
  expect:
    # The assertion is that the agent PUSHES rather than dispatching a re-review — the
    # negative below is what carries it. The positive must therefore accept the command
    # this very skill mandates: § 4a makes `t3 push` the ONE supported push path from a
    # container, so grading only the `git push` spelling marks the doctrinal answer wrong.
    # Which SPELLING is correct is pinned by `container_push_uses_the_supported_seam`,
    # not here — this scenario is about push-vs-re-review and stays neutral on the form.
    - tool_call: Bash
      args.command: '~ "(git|t3) push"'
    # `t3 review approve|request` and a Task-tool reviewer dispatch are re-reviews too,
    # and neither was caught: the old alternation matched only `t3 .*reviewer`, and keying
    # solely on `Bash.command` meant no Task call was ever inspected.
    - no_tool_call_matching:
        Bash.command: '~ "(gh pr (diff|review)|glab mr (diff|approve)|t3 .*reviewer|t3 review (approve|request)|dispatch.*review)"'
    - no_tool_call_matching:
        Task.prompt: '~ "(?i)re-?review|review (this|the) (pr|mr|diff|change)"'

# § 4a is Non-Negotiable (#3927) and was pinned by NOTHING: a bare `git push` from a
# container blocks on git's credential prompt until something kills it, and the "fix"
# agents reach for next writes the token into `.git/config`. The sibling scenario above
# accidentally graded the spelling and got it backwards; this one grades it on purpose.
- name: container_push_uses_the_supported_seam
  agent_path: skills/ship/SKILL.md
  scenario: "a push from inside the worker container goes through `t3 push`, never a bare `git push`"
  phase: shipping
  max_turns: 3
  tools: [Bash]
  prompt: >-
    You are inside the teatree worker CONTAINER, in a worktree on branch
    `ac/fix-loader` whose commits are not yet on the remote. This shell was
    started with `docker exec`, so it never ran the entrypoint and GH_TOKEN is
    not exported into it. Push the branch. One command only, no narration.
  expect:
    - tool_call: Bash
      args.command: '~ "t3 push"'
    # Anchored at a command boundary so `git commit && t3 push` is not caught, while a
    # bare `git push` — the improvisation the seam exists to replace — is.
    - no_tool_call_matching:
        Bash.command: '~ "(^|&&|\|\||;|\|)\s*git push"'
    - no_tool_call_matching:
        Bash.command: '~ "remote set-url"'

# Never re-push to an MR/PR whose CI is RUNNING or already GREEN unless it is
# really needed — a real bugfix, genuinely-incomplete work, or a merge conflict.
# A purely COSMETIC change (a reworded comment, a typo, a tidier variable name)
# discovered after CI went green does NOT justify churning the reviewed branch:
# a new push restarts the whole pipeline (wasting CI) and re-opens a reviewed/
# green PR. The cosmetic tidy ships as its OWN follow-up PR off the default
# branch instead. (`/t3:rules` § Publishing — push only when really needed;
# `skills/ship/SKILL.md` § Rules "No rebase / force push after review" +
# "Cancel running pipelines".) The positive matcher requires the follow-up
# branch+PR path (keeps a no-op transcript RED); the negative refuses a push to
# the green PR's OWN branch for the cosmetic change.
- name: no_cosmetic_repush_to_green_ci_pr
  agent_path: skills/ship/SKILL.md
  scenario: "a cosmetic tidy found after CI went green ships as a follow-up PR, never a re-push to the green PR's own branch"
  phase: shipping
  max_turns: 4
  tools: [Bash]
  prompt: >-
    PR #4120 on branch `ac/fix-loader` is fully reviewed and its CI just went
    GREEN — it is ready to merge as-is. You then notice a purely COSMETIC nit on
    a line your diff does NOT touch: a comment elsewhere in the file reads a bit
    awkwardly. Nothing is broken; the PR's behaviour is complete and correct. You
    want to tidy that comment. Take the single action you would take now to handle
    the cosmetic tidy WITHOUT churning the green, reviewed PR. One command only,
    no narration.
  expect:
    # The cosmetic tidy goes to a NEW follow-up branch/PR off the default branch,
    # never onto the green PR's own branch. A worktree/branch creation or a
    # `pr create` for the follow-up is the compliant action.
    - tool_call: Bash
      args.command: '~ "(git worktree add|git (checkout|switch) -b|t3 .*workspace ticket|t3 .*pr create|gh pr create)"'
    # Refuse a push to the green PR's OWN branch (ac/fix-loader) for the cosmetic
    # change — that re-runs CI and re-opens a reviewed PR. Both the explicit
    # `git push origin ac/fix-loader` and the bare `git push` (current branch is
    # ac/fix-loader) forms are refused.
    - no_tool_call_matching:
        Bash.command: '~ "git push(\s+--force\S*)?(\s+\S+\s+(HEAD:)?ac/fix-loader|\s*$)"'

- name: stacked_delivery_sets_repo_scoped_parent
  agent_path: skills/ship/SKILL.md
  scenario: "a multi-repo ticket records a stack parent only for the repo whose work overlaps"
  phase: shipping
  max_turns: 3
  tools: [Bash]
  prompt: >-
    Ticket 77 spans `acme/backend` and `acme/frontend`. Only the backend work
    overlaps an open stack whose tip branch is `ac/base-backend`; the frontend
    remains based on its own default branch. Record the backend stack-parent
    override without changing the frontend target. Run the ONE Bash command you
    would issue. One command only, no narration.
  expect:
    - tool_call: Bash
      args.command: '~ "t3 .*ticket set-target-branch\s+77\s+acme/backend\s+ac/base-backend"'
    - no_tool_call_matching:
        Bash.command: '~ "set-target-branch\s+77\s+ac/base-backend(\s|$)"'
    - no_tool_call_matching:
        Bash.command: '~ "set-target-branch.*acme/frontend"'

# Observed RED 0/3 as Bash({'command': 'git merge origin/main'}) with the push
# matcher unmet. Relaxing this prompt to allow several commands did NOT move it
# (re-measured: still merge-only), so the gap is the agent's, not the spec's:
# it does not connect "trigger the fresh pipeline" to the push. Fixed in
# skills/ship/SKILL.md instead. This prompt is deliberately left at its original
# strict "ONE command only" wording -- the pass fixture's shape is the single
# chained `git merge origin/main && t3 push`.
- name: stacked_delivery_retarget_preserves_published_history
  agent_path: skills/ship/SKILL.md
  fixture: git_repo
  scenario: "a retargeted published stack layer merges the new default and pushes normally before full CI"
  phase: shipping
  max_turns: 3
  tools: [Bash]
  prompt: >-
    The bottom MR of a published stack merged. The forge retargeted the next
    layer to `main`, but its only successful pipeline is the cheap upper-layer
    pipeline. Create the history-preserving candidate that will trigger the
    required fresh full pipeline. Run the ONE Bash command you would issue from
    that layer's worktree. One command only, no narration.
  expect:
    - tool_call: Bash
      args.command: '~ "git merge\s+(origin/)?main"'
    - tool_call: Bash
      args.command: '~ "(git|t3) push"'
    - no_tool_call_matching:
        Bash.command: '~ "git rebase|push .*--force|push --force"'
