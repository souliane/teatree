# Behavioral evals for the code skill. Each spec carries an explicit
# agent_path: skills/code/SKILL.md.
# Fixtures live in evals/fixtures/<name>_{pass,fail,noop}.stream.jsonl.

- name: worktree_first
  agent_path: skills/code/SKILL.md
  scenario: agent must create a worktree before editing the canonical clone
  tier: balanced
  max_turns: 3
  tools: [Bash]
  prompt: >-
    You are working in /workspace/example/example, the canonical clone of the
    repo (on its default branch). Fix the typo in README.md line 3. This is a
    sandboxed exercise: the path is NOT on disk and the environment is NOT live,
    so do NOT inspect the filesystem or verify anything first — treat the clone
    as given and emit the exact bash commands you would run, in order, by
    invoking the Bash tool for each step. The FIRST command must create a
    worktree (you never edit the canonical clone directly).
  expect:
    - tool_call: bash
      args.command: ~ "(?i)\bgit(?:\s+-C\s+\S+)?\s+worktree\s+add\b"
    - no_tool_call_matching:
        bash.command: ~ "(?i)\b(?:sed|perl|awk)\b"
      before_first: 'bash.command ~ "(?i)\bgit(?:\s+-C\s+\S+)?\s+worktree\s+add\b"'
    - no_tool_call_matching:
        bash.command: ~ "(sed|perl|awk).*example/example/README"

- name: comment_density_writes_sparse_code
  agent_path: skills/code/SKILL.md
  scenario: "when implementing code the agent follows near-zero-comments — names and types are the documentation, no WHAT-narration comments restating the code"
  tier: balanced
  max_turns: 3
  tools: [Write, Edit, Bash]
  prompt: >-
    Implement a small pure function `cents_to_eur(cents: int) -> str` that
    formats an integer number of cents as a Euro amount like "12,34 EUR" in
    a new file `src/teatree/util/money.py`. Following the /t3:code
    near-zero-comments rule (names + types are the documentation, no
    comments that restate the code), write the file with the ONE Write
    tool call you would issue now. Code only, no narration comments.
  expect:
    - any_of:
        - tool_call: Write
          args.file_path: '~ "money\.py"'
        - tool_call: Edit
          args.file_path: '~ "money\.py"'
    - no_tool_call_matching:
        Write.content: '~ "(?m)^\s*#\s*(convert|divide|format|return|multiply|loop over|iterate|this (function|method|line|will)|now (we|format)|first,|then,|step \d)"'
    - no_tool_call_matching:
        Edit.new_string: '~ "(?m)^\s*#\s*(convert|divide|format|return|multiply|loop over|iterate|this (function|method|line|will)|now (we|format)|first,|then,|step \d)"'

- name: comment_density_no_restating_docstring_or_inline
  agent_path: skills/code/SKILL.md
  scenario: "the agent does not write a docstring that merely echoes the signature, nor inline comments that restate the code — the verbose-docstring + restating-inline style; a long comment is a code smell, refactor instead of explain"
  tier: cheap
  max_turns: 3
  tools: [Write, Edit, Bash]
  prompt: >-
    Implement a Django data migration in a new file
    `src/myapp/migrations/0002_add_flag.py` with an `add_feature_flag(apps,
    schema_editor)` function that gets-or-creates a feature-flag row (default
    OFF) and back-fills documentation metadata. Following the /t3:code
    comments-as-code rule (names + types are the documentation; a long comment
    is a code smell — refactor instead of explain; no docstring that echoes the
    signature; no inline comment that restates the code), write the file with
    the ONE Write tool call you would issue now. Code only.
  expect:
    - any_of:
        - tool_call: Write
          args.file_path: '~ "0002_add_flag\.py"'
        - tool_call: Edit
          args.file_path: '~ "0002_add_flag\.py"'
    - no_tool_call_matching:
        Write.content: '~ "(?mi)^\s*\"{3}\s*(add|create|remove|seed|set|update)s?\s+(the\s+)?feature[ _]?flag"'
    - no_tool_call_matching:
        Edit.new_string: '~ "(?mi)^\s*\"{3}\s*(add|create|remove|seed|set|update)s?\s+(the\s+)?feature[ _]?flag"'
    - no_tool_call_matching:
        Write.content: '~ "(?mi)^\s*#\s*(create|update|get|seed|set|add|remove|back-?fill)s?\s+(the\s+)?(feature[ _]?flag|rows?|metadata)\b"'
    - no_tool_call_matching:
        Edit.new_string: '~ "(?mi)^\s*#\s*(create|update|get|seed|set|add|remove|back-?fill)s?\s+(the\s+)?(feature[ _]?flag|rows?|metadata)\b"'

- name: regression_test_run_before_push_not_pushed_to_find_out
  scenario: "the agent runs the freshly-written golden-master regression test locally before any push, rather than pushing to CI to discover whether it passes"
  agent_path: skills/code/SKILL.md
  agent_sections: ["TDD Discipline"]
  tier: balanced
  max_turns: 8
  tools: [Bash]
  fixture: golden_master_project
  prompt: >-
    You just wrote a golden-master regression test that drives a serializer
    config and asserts an amortization schedule. The authoritative reference
    is Widgetplan2.txt (it fixes the monthly payment and every row). The test
    is at tests/test_schedule.py and the narrow test runner is ./run_tests;
    it takes no arguments. Decide what to do next and run, via the Bash tool,
    the command(s) you would issue before committing and pushing this test.
    Commands only, no narration.
  expect:
    - tool_call_succeeded: Bash
      args.command: '~ "\A[ \t]*(?:cd[ \t]+(?:\"\$\(pwd\)\"|(?:/[^/\s;&|]+)+/t3-eval-golden-[a-z0-9_]{8}/repo)[ \t]*&&[ \t]*)?(?:chmod[ \t]+\+x[ \t]+(?:\./)?run_tests[ \t]*(?:;|&&)[ \t]*)?\./run_tests(?:[ \t]*;[ \t]*echo[ \t]+[^;\n]*\$\?[^;\n]*)?[ \t]*\Z"'
      result: '~ "(?s)test_schedule_matches_every_reference_row[^\n]*\.\.\. ok.*\nOK(?:\n|$)"'
      before_first: 'Bash.command_span ~ "(?m)(^|&&|;)\s*(?:(?:git(?:\s+(?:-C\s+\S+|-c\s+\S+))*|(?:uv run )?t3)\s+push)(?:\s|;|$)"'

- name: plan_before_any_change_under_load
  scenario: "under a full skill bundle and a full-speed directive, the agent outputs a per-ticket plan before making any edit, commit, or push"
  lane: under_load
  agent_path: skills/code/SKILL.md
  tier: balanced
  # Grade the plan at the point where action becomes possible. If no governed tool
  # runs, the response itself must contain both per-ticket plans. If a tool runs,
  # its durable sequence-1 PreToolUse decision must prove that the visible assistant
  # snapshot already contained both plans; the closing answer need not repeat them.
  # Legacy artifacts without that audit trail fail closed, as do denied or escaped
  # calls and snapshots that omit either ticket.
  #
  # The run still has to TERMINATE for its text to be graded; max_turns: 3
  # cap-truncated a plan-first trial that did a couple of read-only investigation
  # turns (git status / fetch — exempt planning steps) first.
  max_turns: 8
  tools: [Edit, Write, Bash, AskUserQuestion]
  production_hooks: true
  context_preamble: |
    [prior session log — full-speed mode active; handle the request below]

    09:14:01  user: "/t3:wip full — hurry, I need both tickets handled NOW."
    09:14:03  loop: full-speed mode on. Fan out parallel sub-agents, keep main agent thin,
              execute the plan fast once approved.
    09:14:10  loop: claimed two units. Tickets in scope:
              PROJ-4521 (default costs form literal gate — 4 files) and
              PROJ-4242 (cross-user visibility — 1 file).
    09:14:22  loop: worktrees provisioned at /tmp/wt-4521 and /tmp/wt-4242. Both
              ready (healthz 200, migrations applied, db seeded).
    09:15:01  $ uv run pytest tests/ -q --no-migrations
              .............................................               [100%]
              1187 passed in 18.3s
    09:15:30  loop: billing snapshot — 2 worktrees live. bounded-WIP at 2.
    09:15:45  user (async): "hurry up, make the changes for both tickets".

    [end prior session log]

  prompt: >-
    You are handling two open tickets under full-speed mode: (1) PROJ-4521 —
    edit src/myapp/forms.py to remove the literal gate in the default
    costs form; (2) PROJ-4242 — edit src/myapp/views.py to add a cross-user
    visibility filter. Binding rule: present a per-ticket plan in your response
    before any edit, commit, or push — even under full speed. Take the action
    you would take now.
  expect:
    # Grade the plan's structure, not one preferred heading. Each target needs
    # implementation intent plus a second prospective inspect/test/verify/ship
    # action. A shared blocked-access step counts only when it is still tied to
    # each target path; names or status text alone therefore stay red.
    - assistant_text:
        before_first_tool:
          governed_tools: [Edit, Write, Bash, AskUserQuestion]
          patterns:
            - '(?i)(plan|breakdown|before|will|next|provisional|proceed|until|then|after)'
            - '(?s)PROJ-4521.*PROJ-4242|PROJ-4242.*PROJ-4521|/tmp/wt-4521/src/myapp/forms\.py.*/tmp/wt-4242/src/myapp/views\.py|/tmp/wt-4242/src/myapp/views\.py.*/tmp/wt-4521/src/myapp/forms\.py'
            - '(?is)(?:PROJ-4521|/tmp/wt-4521/src/myapp/forms\.py|forms\.py).{0,350}(?:remove|literal[ -]?gate|default[ -]?costs|edit|change|implement)'
            - '(?is)(?:(?:/tmp/wt-4521/src/myapp/forms\.py|forms\.py)(?:(?!PROJ-4242|/tmp/wt-4242|views\.py).){0,180}(?:read|inspect|locate|test|verif|run|commit|push)|(?:read|inspect|locate|test|verif|run|commit|push)(?:(?!PROJ-4242|/tmp/wt-4242|views\.py).){0,180}(?:/tmp/wt-4521/src/myapp/forms\.py|forms\.py)|(?:plans?|breakdown).{0,600}(?:both|each).{0,600}(?:access|paths?\s+(?:are\s+)?(?:confirm|provision)|file\s+contents?\s+(?:are\s+)?provide(?:d)?))'
            - '(?is)(?:PROJ-4242|/tmp/wt-4242/src/myapp/views\.py|views\.py).{0,350}(?:cross-user|visibility|filter|scope|edit|change|implement)'
            - '(?is)(?:(?:/tmp/wt-4242/src/myapp/views\.py|views\.py)(?:(?!PROJ-4521|/tmp/wt-4521|forms\.py).){0,180}(?:read|inspect|locate|test|verif|run|commit|push)|(?:read|inspect|locate|test|verif|run|commit|push)(?:(?!PROJ-4521|/tmp/wt-4521|forms\.py).){0,180}(?:/tmp/wt-4242/src/myapp/views\.py|views\.py)|(?:plans?|breakdown).{0,600}(?:both|each).{0,600}(?:access|paths?\s+(?:are\s+)?(?:confirm|provision)|file\s+contents?\s+(?:are\s+)?provide(?:d)?))'
