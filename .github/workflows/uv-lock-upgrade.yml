# ============================================================
# WEEKLY uv.lock REFRESH — whole-graph re-resolve
# ============================================================
#
# Dependabot (``uv`` ecosystem since souliane/teatree#4346) proposes per-package
# updates. It does not re-resolve the WHOLE graph, so transitive pins drift
# between the packages it happens to open a PR for.
#
# This workflow closes that residual gap: once a week it runs
# ``uv lock --upgrade``, and if the lockfile changed it opens (or updates) a
# PR against main so a human can review and merge the hash refresh.
#
# souliane/teatree#4437: it also CLASSIFIES what the resolve moved
# (``scripts/ci/lock_delta.py``) and self-merges only a patch-only one. A minor,
# a major, or a version the classifier cannot read withholds auto-merge and
# routes the PR to a human — a boundary crossing is a framework migration, not a
# hash refresh, and must not land unattended over a weekend. The same classifier
# renders the PR body, so what the body claims is what the lockfile resolved.
#
# Cadence: Sunday 03:00 UTC — offset from the dependabot weekly window so the
# lock refresh sees any constraint bumps that landed during the week.
# Also triggerable on-demand via workflow_dispatch.
# ============================================================

name: Scheduled · Weekly uv.lock refresh

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      # #4262: FIRST, because the checkout below is what consumes the credential. A rejected
      # PAT makes checkout die in `could not read Username for 'https://github.com'` — the
      # same bytes an unset secret produces — and this job's own guard sat in its last step,
      # unreachable. Inline rather than a `scripts/` file: nothing is checked out yet.
      - name: Verify TEATREE_GH_TOKEN before the checkout consumes it
        env:
          TEATREE_GH_TOKEN: ${{ secrets.TEATREE_GH_TOKEN }}
        run: |
          set -euo pipefail
          API="${GITHUB_API_URL:-https://api.github.com}"
          if [ -z "${TEATREE_GH_TOKEN:-}" ]; then
            echo "::error::TEATREE_GH_TOKEN is unset or rejected — it is UNSET on ${GITHUB_REPOSITORY}. Set or rotate the secret: the checkout below persists it as the git credential, and git with no usable one falls back to an interactive prompt and dies as 'could not read Username for https://github.com', naming nothing." >&2
            exit 1
          fi
          # A heredoc into curl's config keeps the credential out of argv and the process table.
          cfg="$(mktemp)"
          trap 'rm -f "$cfg"' EXIT
          cat > "$cfg" <<CURLRC
          header = "Authorization: Bearer ${TEATREE_GH_TOKEN}"
          CURLRC
          status="$(curl -sS --config "$cfg" -o /dev/null -w '%{http_code}' --max-time 30 --retry 2 -H 'Accept: application/vnd.github+json' "${API}/repos/${GITHUB_REPOSITORY}" || true)"
          case "${status:-000}" in
            200)
              echo "TEATREE_GH_TOKEN accepted for ${GITHUB_REPOSITORY}."
              ;;
            401|403|404)
              echo "::error::TEATREE_GH_TOKEN is unset or rejected — the forge answered HTTP ${status} for ${GITHUB_REPOSITORY}. The secret IS set, so presence is not the failure: rotate the credential. The checkout below would otherwise die as 'could not read Username for https://github.com', naming nothing." >&2
              exit 1
              ;;
            *)
              echo "::warning::TEATREE_GH_TOKEN is UNVERIFIED — the probe could not reach ${API} (HTTP ${status:-000}). Continuing: read a checkout failure below as unexplained, not as a rejected credential." >&2
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so the PR branch can be force-pushed cleanly on reruns.
          fetch-depth: 0
          # Persist a PAT (not the default GITHUB_TOKEN) as the git credential so
          # the branch push is attributed to a real identity and TRIGGERS the
          # required `test (3.13)` check. A push authenticated with GITHUB_TOKEN
          # never fires downstream workflows (GitHub's recursion guard), so the
          # bot PR would sit with 0 check runs and could never merge (#3245). The
          # probe step above has already proved this credential usable.
          token: ${{ secrets.TEATREE_GH_TOKEN }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.13"
      # #4437: the resolve overwrites uv.lock in place, so the only chance to keep the
      # pre-upgrade versions is before it runs — a copy taken afterwards compares the
      # new lockfile with itself and reports that nothing moved.
      - name: Capture the pre-upgrade lockfile
        run: cp uv.lock "${RUNNER_TEMP}/uv.lock.before"
      - name: Upgrade the lockfile
        run: uv lock --upgrade
      - name: Check whether the lockfile changed
        id: diff
        run: |
          if git diff --quiet uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Classify what the resolve moved
        id: delta
        if: steps.diff.outputs.changed == 'true'
        run: |
          python scripts/ci/lock_delta.py \
            --before "${RUNNER_TEMP}/uv.lock.before" \
            --after uv.lock \
            --body-out "${RUNNER_TEMP}/lock-refresh-body.md"
      - name: Open or update the lock-refresh PR
        if: steps.diff.outputs.changed == 'true'
        env:
          # A PAT (TEATREE_GH_TOKEN), NOT the default GITHUB_TOKEN: a branch pushed
          # / a PR opened with GITHUB_TOKEN never triggers the required
          # `test (3.13)` check (GitHub suppresses workflow-triggered workflows),
          # so the bot PR could never go green and never merge (#3245).
          GH_TOKEN: ${{ secrets.TEATREE_GH_TOKEN }}
          # #4437: the classifier's patch-only verdict. Empty (a skipped or failed
          # classify step) reads as not-safe, so auto-merge is fail-closed by shape.
          AUTO_MERGE: ${{ steps.delta.outputs.auto-merge }}
          BODY_FILE: ${{ runner.temp }}/lock-refresh-body.md
        run: |
          set -euo pipefail
          # Fail LOUD, never silently open an un-mergeable PR: without a
          # CI-triggering token the required check never fires and the refresh
          # stalls forever with 0 check runs (the exact #3245 backlog).
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::TEATREE_GH_TOKEN is unset. The weekly uv.lock PR must be opened with a PAT that triggers the required 'test (3.13)' check — the default GITHUB_TOKEN does not, so the PR could never merge. Set the TEATREE_GH_TOKEN secret." >&2
            exit 1
          fi
          # #4437: reuse an already-open refresh PR's branch. A review-required resolve
          # does not merge, and the same boundary is still there next Sunday, so a dated
          # branch would stack one more identical PR every week until a human acted.
          EXISTING="$(gh pr list --state open --limit 100 --json headRefName \
            -q '[.[].headRefName | select(startswith("chore/uv-lock-upgrade"))][0] // empty')"
          BRANCH="${EXISTING:-chore/uv-lock-upgrade-$(date +%Y-%W)}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add uv.lock
          git commit -m "chore(deps): weekly uv.lock upgrade"
          git push --force-with-lease origin "$BRANCH"
          # The body states what the resolve MOVED. #4432 claimed a Django 6.1 update its
          # own lockfile did not produce, so a body written once at creation and never
          # refreshed is worse than none: a rerun force-pushes a different resolve under it.
          if gh pr view "$BRANCH" --json number -q .number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file "$BODY_FILE"
          else
            gh pr create \
              --title "chore(deps): weekly uv.lock upgrade" \
              --body-file "$BODY_FILE" \
              --base main \
              --label "dependencies"
          fi
          # Self-merge once green ONLY when every move is patch-level inside its pinned
          # series (#3245 wanted the backlog gone, not a framework migration landing over
          # a weekend). Best-effort: if the repo has not enabled auto-merge, warn — the PR
          # still carries CI and the loop's trusted-merge path can land it.
          if [ "${AUTO_MERGE:-}" = "true" ]; then
            gh pr merge "$BRANCH" --auto --squash --delete-branch \
              || echo "::warning::Could not enable auto-merge on $BRANCH — enable 'Allow auto-merge' in the repo settings, or let the ship loop merge it once green."
          else
            echo "::warning::$BRANCH crosses a feature/major boundary (or carries a version the classifier could not read), so auto-merge is withheld — it needs a human. The PR body names what moved."
            # The branch is reused, so clear an auto-merge a previous patch-only run armed.
            gh pr merge "$BRANCH" --disable-auto || true
          fi
