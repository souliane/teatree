# Temporary probe for #5006, removed before merge: does a dependent gated on
# `!cancelled()` still run when a needed matrix leg ends `cancelled` because it
# hit its own timeout-minutes, while the run itself is not cancelled?
name: Probe · cancelled() after a dependency timeout

on:
  pull_request:

jobs:
  legs:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [quick, slow]
    steps:
      - env:
          LEG: ${{ matrix.leg }}
        run: if [ "$LEG" = slow ]; then sleep 150; fi

  after-not-cancelled:
    needs: legs
    if: >
      !cancelled() &&
      github.event_name == 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - run: echo "legs=${{ needs.legs.result }}"

  after-always:
    needs: legs
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - run: echo "legs=${{ needs.legs.result }}"

  after-default:
    needs: legs
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - run: echo "legs=${{ needs.legs.result }}"
