# Docker Compose for teatree CI/testing tasks.
# Lightweight, SQLite-only, ephemeral containers.
#
# Usage (prefer t3 CLI wrappers):
#   t3 teatree run tests          # unit tests
#   t3 teatree e2e project      # E2E with parallel Playwright workers

x-base: &base
  build:
    context: ..
    dockerfile: dev/Dockerfile.test
    # The Dockerfile is multi-stage (a `lint` stage bakes prek's hook envs FROM
    # base); pin the target explicitly so an untargeted build never silently
    # produces the LAST stage instead.
    target: base
  volumes:
    - ..:/app:ro
  environment:
    UV_PROJECT_ENVIRONMENT: /tmp/.venv
    COVERAGE_FILE: /tmp/.coverage
  working_dir: /app

services:
  tests:
    <<: *base
    command: >
      uv run pytest
      --no-header --no-cov -v
      -o cache_dir=/tmp/.pytest_cache
    profiles: [tests]

  e2e:
    <<: *base
    # Pin platform to linux/amd64 for arch parity with CI's x86_64 runners; unpinned,
    # Apple Silicon Docker pulls the aarch64 image and renders fonts differently.
    platform: linux/amd64
    volumes:
      - ..:/app:ro
      # Writable mounts for failure triage — host paths are git-ignored.
      - ../e2e/.logs:/app/e2e/.logs
      - ../e2e/.videos:/app/e2e/.videos
    build:
      context: ..
      dockerfile: dev/Dockerfile.e2e
      # Explicit, so a future second stage never silently becomes the build output.
      target: base
    # `--ds`, not `-o DJANGO_SETTINGS_MODULE`: pytest-django ranks the command-line flag
    # above the ini key, and the root addopts PREPEND `--ds=tests.django_settings`, so the
    # ini form is silently discarded and the lane runs under the unit-test settings. Ours
    # is later on the line, so it wins. Flags mirror ci.yml's dash-e2e job.
    entrypoint: ["uv", "run", "pytest",
      "--no-cov", "-p", "no:tach", "-v",
      "-n0", "-p", "no:randomly",
      "-o", "cache_dir=/tmp/.pytest_cache",
      "--ds=e2e.dash.settings"]
    command: ["e2e/dash"]
    profiles: [e2e]
