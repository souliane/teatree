[loops.ratchet_repair]
delay_seconds = 1800
colleague_facing = false
description = "Reads the teatree core clone every 30m and reports reference-ratchet pins the tree no longer resolves, naming the one-command repair. Observe-only: it writes nothing and opens nothing."

[loops.memory_skim]
delay_seconds = 604800
colleague_facing = false
description = "Skims the Claude memories weekly and raises ONE promote-or-drop question naming every memory that reads as factory behaviour; the scanner dedupes on the ISO week."

