colleague_facing = false
default_enabled = false
description = "Refreshes each overlay-declared reference DB's DSLR snapshot out-of-band once a day so a ticket-critical-path provision never pays the slow restore+migrate path."

[loops.dispatch]
delay_seconds = 300
colleague_facing = false
default_enabled = true
description = "Runs the always-on global scanners every 5m: dispatches pending headless Tasks to phase sub-agents, ingests incoming events, redelivers undelivered notifies, and posts deferred questions."

[loops.tickets]
delay_seconds = 300
colleague_facing = false
default_enabled = true
description = "Scans the local Ticket DB and each code host every 5m — surfacing active and stale tickets, dispositioning issues, and marking completed ones."

[loops.review]
delay_seconds = 300
colleague_facing = false
default_enabled = false
description = "Reviews open PRs every 5m and posts inline findings via t3:reviewer — your OWN PRs always (per-SHA deduped), plus colleague-authored PRs when admit_colleague_prs_to_board is on. Always runs (not colleague-facing); self-review keeps going unattended."

[loops.ship]
delay_seconds = 300
colleague_facing = false
default_enabled = false
description = "Sweeps your own-authored + same-repo open PRs every 5m: folds in approvals/CI, arms the cold review, and executes the keystone merge (consumes the orchestrator's MergeClear). Runs under autonomous_away so the merge path never starves."

[loops.issue_disposition]
delay_seconds = 300
colleague_facing = false
default_enabled = false
description = "Auto-closes high-confidence DEAD backlog issues (already-shipped / duplicate / obsolete) every 5m; default-off behind auto_disposition_enabled, bounded per tick."

[loops.audit]
delay_seconds = 1800
colleague_facing = false
default_enabled = false
description = "Verifies and posts per-overlay failed-E2E results to Slack (driven by overlay watchers) every 30m."

[loops.followup]
delay_seconds = 1800
colleague_facing = true
default_enabled = false
description = "Intakes newly-assigned issues (auto-starting ready ones) and fires the review-request nag every 30m."

[loops.issue_implementer]
delay_seconds = 1800
colleague_facing = false
default_enabled = false
description = "Discovers and claims admitted backlog issues to auto-implement, kicking off the maker pipeline; every 30m. issue_implementer_enabled ships ON (#3895), so this Loop row is the remaining switch."

[loops.triage_assessor]
delay_seconds = 3600
colleague_facing = false
default_enabled = false
description = "Assesses OPEN needs-triage issues hourly and queues keep/close/needs-info recommendations behind an ask-gate; triage_assessor_enabled ships ON (#3895), so this Loop row is the remaining switch, and it never acts without per-item approval."

[loops.dm_sweep]
delay_seconds = 3600
colleague_facing = false
default_enabled = false
description = "Sweeps the owner's DM threads hourly and resolves the ones that no longer need them (owner already replied, subject merged/closed, duplicate of an open thread); leaves anything older than a day for the resurfacing side, and says nothing when it resolved nothing."

[loops.housekeeping]
delay_seconds = 3600
colleague_facing = false
default_enabled = true
description = "Fast-forwards the editable teatree and overlay installs (self-update), pulls each overlay's main clone, and reconciles the ticket board against forge truth, hourly."

[loops.arch_review]
delay_seconds = 10800
colleague_facing = false
default_enabled = false
description = "Dispatches a sub-agent every 3h to run a holistic, codebase-wide architectural review via the ac-reviewing-codebase skill."
prompt_body = "Run an architectural review of the codebase using the ac-reviewing-codebase skill. Dispatch a sub-agent that loads /ac-reviewing-codebase and performs a holistic, codebase-wide architectural review, surfacing findings as the skill prescribes."

[loops.dogfood]
delay_seconds = 86400
colleague_facing = false
default_enabled = false
description = "Runs the overlay provisioning smoke test once a day to catch broken worktree setup."

[loops.eval_local]
delay_seconds = 86400
colleague_facing = false
default_enabled = false
description = "Runs the local behavioral eval suite; the scanner enforces its own weekly cadence (checked daily)."

[loops.db_backup]
delay_seconds = 86400
colleague_facing = false
default_enabled = true
description = "Backs up teatree's own control DB daily and prunes past the keep-last-N-days retention (directive #2); the scanner enforces db_backup_cadence_hours, gated by db_backup_disabled."

[loops.backlog_sweep]
delay_seconds = 86400
colleague_facing = false
default_enabled = false
description = "Sweeps the backlog daily to propose closing stale issues; default-off (destructive-capable) behind backlog_sweep_disabled, gated by ask_before_backlog_sweep_closes."

[loops.news]
delay_seconds = 86400
daily_at = 08:00:00
colleague_facing = false
default_enabled = false
description = "Fires the daily news-scan task at 08:00 to surface relevant external releases and improvement ideas."

[loops.dream]
delay_seconds = 86400
daily_at = 03:00:00
colleague_facing = false
default_enabled = false
description = "Runs the nightly memory-consolidation pass at 03:00 — cross-link, merge, reindex MEMORY.md, decay — off the live tick."

[loops.outer_loop]
delay_seconds = 86400
colleague_facing = false
default_enabled = false
description = "Advances at most one T4 autoresearch experiment one step per day (propose, ratify, implement, measure, keep-only-if-better), off the live tick; ships disabled behind the outer_loop_enabled flag and the critic-live guard."

[loops.directive_loop]
delay_seconds = 3600
colleague_facing = false
default_enabled = false
description = "Hourly, off the live tick: interprets captured owner directives up to directive_intake_per_tick per pass and stops at the human ratify gate, then advances one ratified directive one step (implement, configure, verify, keep-only-if-verified, else human-asked revert); directive_loop_enabled ships ON (#3895), so this Loop row is the remaining switch, and the execution arc additionally needs the factory-score and critic-live guards."

[loops.ci_eval_heal]
delay_seconds = 300
colleague_facing = false
default_enabled = false
description = "Advances operator-opened CI-eval heal sessions every 5m (observe-only): dispatch the behavioral eval in CI, poll, and GREEN or HALT+escalate on any red — never a fix. Default-OFF (autonomous CI mutation); an operator opens sessions and enables the row."

[loops.memory_skim]
delay_seconds = 604800
colleague_facing = false
default_enabled = false
description = "Skims the Claude memories weekly (directive 32) and raises ONE promote-or-drop question naming every memory that reads as factory behaviour; the scanner dedupes on the ISO week. Default-OFF."

