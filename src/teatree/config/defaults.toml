[loops.inbox]
delay_seconds = 60
colleague_facing = false
description = "Drains inbound Slack mentions, DMs, review-intent and RED-CARD reactions (plus the Notion view) into the DB every 1m and routes them."

[loops.idle_stack_reaper]
delay_seconds = 60
colleague_facing = false
description = "Stops local dev stacks left idle past their threshold to free a concurrency slot; checks every 1m."

[loops.local_stack_queue]
delay_seconds = 60
colleague_facing = false
description = "Drains the local-stack acquisition queue, starting the next queued worktree stack whose backoff retry is due; checks every 1m."

[loops.resource_pressure]
delay_seconds = 60
colleague_facing = false
description = "Auto-frees host disk and RAM when they cross the pressure threshold; checks every 1m on its own ~5m internal cadence."

[loops.snapshot_warmer]
delay_seconds = 86400
colleague_facing = false
description = "Refreshes each overlay-declared reference DB's DSLR snapshot out-of-band once a day so a ticket-critical-path provision never pays the slow restore+migrate path."

[loops.dispatch]
delay_seconds = 300
colleague_facing = false
description = "Runs the always-on global scanners every 5m: dispatches pending headless Tasks to phase sub-agents, ingests incoming events, redelivers undelivered notifies, and posts deferred questions."

[loops.tickets]
delay_seconds = 300
colleague_facing = false
description = "Scans the local Ticket DB and each code host every 5m — surfacing active and stale tickets, dispositioning issues, and marking completed ones."

[loops.review]
delay_seconds = 300
colleague_facing = false
description = "Reviews open PRs every 5m and posts inline findings via t3:reviewer — your OWN PRs always (per-SHA deduped), plus colleague-authored PRs when admit_colleague_prs_to_board is on. The away-gate never skips it (colleague_facing = false), so self-review keeps going while the owner is unreachable."

[loops.ship]
delay_seconds = 300
colleague_facing = false
description = "Sweeps your own-authored + same-repo open PRs every 5m: folds in approvals/CI, arms the cold review, and executes the keystone merge (consumes the orchestrator's MergeClear). Runs under autonomous_away so the merge path never starves."

[loops.issue_disposition]
delay_seconds = 300
colleague_facing = false
description = "Auto-closes high-confidence DEAD backlog issues (already-shipped / duplicate / obsolete) every 5m, only for t3-teatree owned repos; bounded per tick."

[loops.audit]
delay_seconds = 1800
colleague_facing = false
description = "Verifies and posts per-overlay failed-E2E results to Slack (driven by overlay watchers) every 30m."

[loops.followup]
delay_seconds = 1800
colleague_facing = true
description = "Intakes newly-assigned issues (auto-starting ready ones) and fires the review-request nag every 30m."

[loops.issue_implementer]
delay_seconds = 1800
colleague_facing = false
description = "Discovers and claims admitted backlog issues to auto-implement, kicking off the maker pipeline; every 30m. The active preset decides whether it runs."

[loops.triage_assessor]
delay_seconds = 86400
colleague_facing = false
description = "Assesses OPEN needs-triage issues daily and queues keep/close/needs-info recommendations behind an ask-gate; this row IS the cadence, the active preset decides whether it runs, and it never acts without per-item approval."

[loops.dm_sweep]
delay_seconds = 3600
colleague_facing = false
description = "Sweeps the owner's DM threads hourly and resolves the ones that no longer need them (owner already replied, subject merged/closed, duplicate of an open thread); leaves anything older than a day for the resurfacing side, and says nothing when it resolved nothing."

[loops.housekeeping]
delay_seconds = 3600
colleague_facing = false
description = "Fast-forwards the editable teatree and overlay installs (self-update), pulls each overlay's main clone, and reconciles the ticket board against forge truth, hourly."

[loops.arch_review]
delay_seconds = 86400
daily_at = 04:00:00
colleague_facing = false
description = "Dispatches a sub-agent at 04:00 to run a holistic, codebase-wide architectural review via the architectural-review skill; the scanner enforces architectural_review_cadence_hours (168) and the merge-count backstop, so this row is only how often that gate is CHECKED — and, because a failed review leaves that clock untouched, how soon a failed one retries."
prompt_body = "Run an architectural review of the codebase using the architectural-review skill. Dispatch a sub-agent that loads /t3:architectural-review and performs a holistic, codebase-wide architectural review, surfacing findings as the skill prescribes."

[loops.dogfood]
delay_seconds = 86400
colleague_facing = false
description = "Runs the overlay provisioning smoke test once a day to catch broken worktree setup."

[loops.eval_local]
delay_seconds = 604800
colleague_facing = false
description = "Runs the local behavioral eval suite weekly; this row IS the cadence."

[loops.db_backup]
delay_seconds = 86400
daily_at = 02:00:00
colleague_facing = false
description = "Backs up teatree's own control DB at 02:00 and prunes past the keep-last-N-days retention; this row IS the cadence."

[loops.backlog_sweep]
delay_seconds = 86400
colleague_facing = false
description = "Groups the backlog daily — bundles related issues into an existing host and closes nothing for real; this row plus the active preset are the switch, gated by ask_before_backlog_sweep_closes."

[loops.news]
delay_seconds = 86400
daily_at = 08:00:00
colleague_facing = false
description = "Fires the daily news-scan task at 08:00 to surface relevant external releases and improvement ideas."

[loops.dream]
delay_seconds = 86400
daily_at = 03:00:00
colleague_facing = false
